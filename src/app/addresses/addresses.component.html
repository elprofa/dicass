  <!-- Sidebar (Offcanvas) -->
<app-loader></app-loader>
<app-sidebar></app-sidebar>

  <!-- Main Body Wrapper -->
  <div class="body-wrap">
    <!-- Header -->
    <header class="app-header">
      <button class="btn btn-icon" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebarMenu">
        <i class="bi bi-list"></i>
      </button>
      <a class="navbar-brand-custom" routerLink="/addresses">Mes adresss</a>
      <div class="header-actions">
        <a routerLink="/search" class="btn btn-icon">
          <i class="bi bi-search"></i>
        </a>
        <a routerLink="/notifications" class="btn btn-icon notification-indicator">
          <i class="bi bi-bell"></i>
        </a>
      </div>
    </header>

    <!-- Main Content -->
    <main class="container-fluid mt-3">


      <div *ngFor="let address of addresses" class="payment-card" [ngClass]="{'default-card': address.isDefault}">
        <div class="card-brand-logo border rounded-3 d-flex align-items-center justify-content-center">
          <i [ngClass]="{
            'bi-house': address.type === 'home',
            'bi-briefcase': address.type === 'work',
            'bi-geo-alt': address.type === 'other'
          }"></i>
        </div>
        <div class="card-details">
          <h6 class="mb-0">{{ address.label }}</h6>
          <small class="text-muted">{{ address.details }}</small>
        </div>
        <span class="default-indicator" *ngIf="address.isDefault"><i class="bi bi-check-circle-fill me-1"></i> Par défaut</span>
        <div class="dropdown ms-auto" [class.show]="showDropdown[address.id]" (mouseleave)="closeDropdown(address.id)">
          <button class="btn btn-icon" type="button" (click)="toggleDropdown(address.id)">
            <i class="bi bi-three-dots-vertical"></i>
          </button>
          <ul class="dropdown-menu dropdown-menu-end" [class.show]="showDropdown[address.id]">
            <li><a class="dropdown-item" [routerLink]="['/edit-address', address.id]" (click)="$event.preventDefault(); closeDropdown(address.id)">Modifier</a></li>
            <li *ngIf="!address.isDefault"><a class="dropdown-item" href="#" (click)="setDefault(address.id); closeDropdown(address.id)">Définir par défaut</a></li>
            <li><a class="dropdown-item text-danger" href="#" (click)="removeAddress(address.id); closeDropdown(address.id)">Supprimer</a></li>
          </ul>
        </div>
      </div>

      <!-- Bouton pour ajouter une nouvelle adresse -->
      <a routerLink="/add-address" class="btn btn-primary w-100 mt-3">
        <i class="bi bi-plus-circle-fill me-2"></i>Ajouter une adresse
      </a>
    </main>
  </div>
  <app-footer></app-footer>
