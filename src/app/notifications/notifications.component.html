<app-sidebar></app-sidebar>
<div class="body-wrap">
  <!-- Header -->
  <header class="app-header">
    <button class="btn btn-icon" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebarMenu">
      <i class="bi bi-list"></i>
    </button>
    <a class="navbar-brand-custom" routerLink="/home">FreshCart</a>
    <div class="header-actions">
      <a routerLink="/search" class="btn btn-icon">
        <i class="bi bi-search"></i>
      </a>
      <a routerLink="/notifications" class="btn btn-icon notification-indicator">
        <i class="bi bi-bell"></i>
      </a>
    </div>
  </header>

  <!-- Main Content -->
  <main class="container-fluid mt-3">
    <!-- Page Header with Action -->
    <div class="notifications-header mb-3">
      <h6 class="m-0">Notifications</h6>
      <a href="#" class="text-primary text-decoration-none">Mark all as read</a>
    </div>
    <!-- Notifications List -->
    <div class="notifications-list">
      <!-- Unread Notification Item -->
      <a href="#" class="notification-card unread">
        <span class="notification-dot"></span>
        <div class="notification-icon icon-info">
          <i class="bi bi-truck"></i>
        </div>
        <div class="notification-text">
          <h6 class="mb-1">Your order #12345 is on its way!</h6>
          <small class="text-muted">2 mins ago</small>
        </div>
      </a>
      <!-- Unread Notification Item -->
      <a href="#" class="notification-card unread">
        <span class="notification-dot"></span>
        <div class="notification-icon icon-warning">
          <i class="bi bi-tags"></i>
        </div>
        <div class="notification-text">
          <h6 class="mb-1">A new coupon <code class="small">FRESH20</code> has been added to your account.</h6>
          <small class="text-muted">1 hour ago</small>
        </div>
      </a>
      <!-- Read Notification Item -->
      <a href="#" class="notification-card">
        <div class="notification-icon icon-success">
          <i class="bi bi-check-circle"></i>
        </div>
        <div class="notification-text">
          <h6 class="mb-1">Your order #12344 was successfully delivered.</h6>
          <small class="text-muted">Yesterday</small>
        </div>
      </a>
    </div>
    <!-- Empty State (to be shown when there are no notifications) -->
    <div class="empty-state mt-5 d-none">
      <!-- Remove "d-none" to see this -->
      <i class="bi bi-bell-slash"></i>
      <h4>All Caught Up!</h4>
      <p class="text-muted">You have no new notifications.</p>
    </div>
  </main>
</div>
<app-footer></app-footer>
