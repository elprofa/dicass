<app-sidebar></app-sidebar>
<div class="body-wrap">
  <!-- Header -->
  <header class="app-header">
    <button class="btn btn-icon" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebarMenu">
      <i class="bi bi-list"></i>
    </button>
    <a class="navbar-brand-custom" routerLink="/">Notifications</a>
    <div class="header-actions">
      <a routerLink="/search" class="btn btn-icon">
        <i class="bi bi-search"></i>
      </a>
      <a routerLink="/notifications" class="btn btn-icon notification-indicator">
        <i class="bi bi-bell"></i>
      </a>
    </div>
  </header>

  <!-- Main Content -->
  <main class="container-fluid mt-3">
    <!-- Page Header with Action -->
    <div class="notifications-header mb-3">
      <h6 class="m-0">Notification</h6>
      <a href="#" class="text-primary text-decoration-none">Tout marquer comme lu</a>
    </div>
    <!-- Loading State -->
    <div *ngIf="loading" class="text-center my-5">
      <div class="spinner-border text-primary" role="status"></div>
      <div>Chargement…</div>
    </div>
    <!-- Error State -->
    <div *ngIf="errorMsg && !loading" class="alert alert-danger">{{ errorMsg }}</div>
    <!-- Notifications List -->
    <div *ngIf="!loading && notifications.length > 0" class="notifications-list">
      <a *ngFor="let n of notifications" class="notification-card" [ngClass]="{'unread': !n.read}">
        <span *ngIf="!n.read" class="notification-dot"></span>
        <div class="notification-icon" [ngClass]="{
            'icon-info': n.type === 'info',
            'icon-warning': n.type === 'warning',
            'icon-success': n.type === 'success',
            'icon-danger': n.type === 'danger'
          }">
          <i class="bi" [ngClass]="n.icon || 'bi-bell'"></i>
        </div>
        <div class="notification-text">
          <h6 class="mb-1">{{ n.title }}</h6>
          <small class="text-muted">{{ n.timeAgo || n.date || '' }}</small>
        </div>
      </a>
    </div>
    <!-- Empty State -->
    <div *ngIf="!loading && notifications.length === 0 && !errorMsg" class="empty-state mt-5">
      <i class="bi bi-bell-slash"></i>
      <h4>Vous êtes à jour !</h4>
      <p class="text-muted">Vous n'avez pas de nouvelles notifications.</p>
    </div>
  </main>
</div>
<app-footer></app-footer>
