  <app-sidebar></app-sidebar>

  <!-- Main Body Wrapper -->
  <div class="body-wrap">
    <!-- Header -->
    <header class="app-header">
      <button class="btn btn-icon" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebarMenu">
        <i class="bi bi-list"></i>
      </button>
      <a class="navbar-brand-custom" routerLink="/home">FreshCart</a>
      <div class="header-actions">
        <a routerLink="/search" class="btn btn-icon">
          <i class="bi bi-search"></i>
        </a>
        <a routerLink="/notifications" class="btn btn-icon notification-indicator">
          <i class="bi bi-bell"></i>
        </a>
      </div>
    </header>

    <!-- Main Content -->
    <main class="container-fluid mt-4 pt-2">

      <!-- Profile Avatar Uploader -->
      <div class="profile-uploader">
        <div class="avatar-wrapper">
          <img src="assets/img/user.jpg" alt="User Avatar" class="profile-avatar-large">
          <button class="btn btn-light btn-sm change-photo-btn">
            <i class="bi bi-camera-fill"></i>
          </button>
        </div>
        <h5 class="mt-3">John Doe</h5>
      </div>

      <!-- Profile Form -->
      <div class="profile-form-card">
        <form>
          <div class="input-group mb-3">
            <span class="input-group-text"><i class="bi bi-person"></i></span>
            <div class="form-floating flex-grow-1">
              <input type="text" class="form-control" id="fullName" placeholder="John Doe" value="John Doe">
              <label for="fullName">Full Name</label>
            </div>
          </div>

          <div class="input-group mb-3">
            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
            <div class="form-floating flex-grow-1">
              <input type="email" class="form-control" id="emailAddress" placeholder="Email"
                value="john.doe@example.com" disabled>
              <label for="emailAddress">Email Address</label>
            </div>
          </div>

          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-telephone"></i></span>
            <div class="form-floating flex-grow-1">
              <input type="tel" class="form-control" id="phoneNumber" placeholder="Phone Number" value="+1 234 567 890">
              <label for="phoneNumber">Phone Number</label>
            </div>
          </div>
        </form>
      </div>

    </main>

    <div class="fixed-bottom bg-white p-3 border-top">
      <div class="d-grid">
        <button type="submit" class="btn btn-primary">Save Changes</button>
      </div>
    </div>
  </div>
