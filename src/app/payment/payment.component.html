<app-sidebar></app-sidebar>

  <!-- Main Body Wrapper -->
  <div class="body-wrap">
    <!-- Header -->
    <header class="app-header">
      <button class="btn btn-icon" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebarMenu">
        <i class="bi bi-list"></i>
      </button>
      <a class="navbar-brand-custom" routerLink="/">

        <div class="d-flex flex-column">
          <h6 class="fw-bold m-0">Payment Methods</h6>
          <small class="text-muted fs-10 fw-normal">Manage your saved payment options.</small>
        </div>

      </a>
      <div class="header-actions">
        <a routerLink="/search" class="btn btn-icon">
          <i class="bi bi-search"></i>
        </a>
        <a routerLink="/notifications" class="btn btn-icon notification-indicator">
          <i class="bi bi-bell"></i>
        </a>
      </div>
    </header>

    <!-- Main Content -->
    <main class="container-fluid mt-3">

      <!-- Saved Cards List -->

      <div class="payment-options-list">
        <div *ngFor="let method of paymentMethods" class="payment-card" [ngClass]="{'default-card': method.isDefault}">
          <img *ngIf="method.brand === 'visa'" src="assets/img/visa.svg" alt="Visa" class="card-brand-logo">
          <img *ngIf="method.brand === 'mastercard'" src="assets/img/mastercard.svg" alt="Mastercard" class="card-brand-logo">
          <img *ngIf="method.brand === 'paypal'" src="assets/img/paypal.svg" alt="PayPal" class="card-brand-logo">
          <div class="card-details">
            <h6 class="mb-0">
              <ng-container [ngSwitch]="method.brand">
                <span *ngSwitchCase="'visa'">Visa •••• {{method.last4}}</span>
                <span *ngSwitchCase="'mastercard'">Mastercard •••• {{method.last4}}</span>
                <span *ngSwitchCase="'paypal'">Connect PayPal</span>
              </ng-container>
            </h6>
            <small class="text-muted" *ngIf="method.expiry">Expires {{method.expiry}}</small>
          </div>
          <span class="default-indicator" *ngIf="method.isDefault"><i class="bi bi-check-circle-fill me-1"></i> Default</span>
          <div class="dropdown ms-auto" [class.show]="showDropdown[method.id]" (mouseleave)="closeDropdown(method.id)">
            <button class="btn btn-icon" type="button" (click)="toggleDropdown(method.id)">
              <i class="bi bi-three-dots-vertical" *ngIf="method.brand !== 'paypal'"></i>
              <i class="bi bi-chevron-right" *ngIf="method.brand === 'paypal'"></i>
            </button>
            <ul class="dropdown-menu dropdown-menu-end" [class.show]="showDropdown[method.id]">
              <li *ngIf="!method.isDefault && method.brand !== 'paypal'"><a class="dropdown-item" href="#" (click)="setDefault(method.id); closeDropdown(method.id)">Set as Default</a></li>
              <li><a class="dropdown-item text-danger" href="#" (click)="removeMethod(method.id); closeDropdown(method.id)">Remove</a></li>
            </ul>
          </div>
        </div>

        <!-- Add New Card Button -->
        <a routerLink="/add-card" class="add-new-card">
          <i class="bi bi-plus-lg"></i>
          <span>Add a new card</span>
        </a>
      </div>

      <!-- Other Payment Methods -->
      <!-- Digital wallets (PayPal) are now included in the dynamic list above -->
    </main>
  </div>
  <app-footer></app-footer>
